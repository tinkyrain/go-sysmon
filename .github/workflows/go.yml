name: go-sysmon-ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
        cache: true

    - name: Install dependencies
      run: go mod install

    - name: Vet
      run: go vet ./....
      
    - name: Linter
      run: golangci/golangci-lint-action@v6

    - name: Tests
      run: go test ./... -cover -v
