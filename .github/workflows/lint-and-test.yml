name: lint-and-test

on:
  push:
  pull_request:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Gofmt
      run: gofmt -l .

    - name: Linter
      uses: golangci/golangci-lint-action@v6

    - name: Tests
      run: go test ./... -cover -v -race
