version: '3'

tasks:
  run:
    desc: Start application
    cmds:
      - go run ./...

  tests:
    desc: Run tests
    cmds:
      - go test ./... --cover

  tests-with-report:
    desc: Run tests with HTML report
    cmds:
      - go test ./... -coverprofile=coverage.out
      - go tool cover -html=coverage.out -o coverage.html

  lint:
    desc: Start lint project
    cmds:
      - golangci-lint run

  validate:
   desc: The entire code validation chain
   cmds:
     - golangci-lint run
     - go test ./... --cover
