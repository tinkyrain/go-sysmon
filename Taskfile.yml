version: '3'

tasks:
  tests:
    desc: Run tests
    cmds:
      - go test ./... --cover

  tests-with-report:
    desc: Run tests with HTML report
    cmds:
      - go test ./... -coverprofile=coverage.out
      - go tool cover -html=coverage.out

  vet:
    desc: Start go vet
    cmds:
      - go vet ./...

  lint:
    desc: Start lint project
    cmds:
      - golangci-lint run
